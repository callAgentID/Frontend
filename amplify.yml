version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm install --legacy-peer-deps
    build:
      commands:
        # Amplify console variables are available during the build, but Next.js
        # server routes only receive values loaded through a Next env file.
        # Keep the Clerk secret server-only: never copy a NEXT_PUBLIC secret.
        - test -n "$CLERK_SECRET_KEY"
        - env | grep -E '^(CLERK_SECRET_KEY|CLERK_BACKEND_API_URL|CLERK_FRONTEND_API_URL|CLERK_JWKS_URL|NEXT_PUBLIC_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
